      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");
      html,
      body {
        min-height: 100%;
      }
      body {
        font-family: "Inter", sans-serif;

      .app-sidebar {
        position: fixed;

        left: 0;
        width: 16rem;
        height: 100vh;
      }
      .sidebar-item-active {
        background: linear-gradient(

      }
      .data-section {

        overflow: hidden;
        display: flex;

      }
      .section-title {

      }

        min-height: 0;

      .topology-layout,

      .el-table.dark-data-table {

        --el-table-tr-bg-color: transparent;
        --el-table-header-bg-color: rgba(37, 99, 235, 0.22);

      .dark-data-table .el-table__inner-wrapper::before,
      .dark-data-table .el-table__border-left-patch {

      .dark-data-table .el-table__cell {
        background: transparent;

      .vpp-summary-card,

          min-height: 220px;
        }

        .vpp-summary-card {

    <script>
      (async () => {
      const marketData = await window.SystemAccess.loadDataAsset({
        jsonPath: "assets/data.json",
        scriptPath: "assets/data.js",
        globalKey: "VPP_MARKET_DATA",
      });
      window.MarketUI = window.createMarketUI(marketData);

      const { createApp, ref, computed, nextTick, onMounted, onBeforeUnmount, watch } = Vue;

      const TopologyGraph = {
        props: { deployments: { type: Array, default: () => [] } },
        template: '<div class="topology-graph" ref="container"></div>',
        setup(props) {
          const container = ref(null);
          const graph = ref(null);
          let resizeObserver = null;
          let resizeTimer = null;

          const renderGraph = () => {
            const graphContainer = container.value;
            if (!graphContainer || !window.G6 || !props.deployments.length) return;
            if (graph.value) graph.value.destroy();

            const width = graphContainer.clientWidth;
            const height = graphContainer.clientHeight;
            if (!width || !height) return;
            const centerX = width / 2;
            const topologyBounds = {
              left: width * 0.08,
              right: width * 0.92,
              top: height * 0.12,
              bottom: height * 0.62,
            };
            const scatterPositions = [
              [0.08, 0.28], [0.18, 0.16], [0.29, 0.34], [0.39, 0.12], [0.51, 0.27],
              [0.65, 0.15], [0.78, 0.31], [0.91, 0.19], [0.14, 0.50], [0.26, 0.59],
              [0.43, 0.48], [0.56, 0.63], [0.70, 0.50], [0.86, 0.61], [0.06, 0.78],
              [0.19, 0.86], [0.34, 0.75], [0.49, 0.88], [0.62, 0.77], [0.82, 0.84],
              [0.13, 0.08], [0.24, 0.24], [0.37, 0.30], [0.47, 0.18], [0.58, 0.38],
              [0.73, 0.25], [0.86, 0.41], [0.05, 0.42], [0.20, 0.67], [0.35, 0.55],
              [0.50, 0.58], [0.64, 0.69], [0.79, 0.55], [0.96, 0.73], [0.11, 0.94],
              [0.28, 0.90], [0.44, 0.70], [0.67, 0.92], [0.91, 0.91],
            ];
            const scatterX = (ratio) => topologyBounds.left + ratio * (topologyBounds.right - topologyBounds.left);
            const scatterY = (ratio) => topologyBounds.top + ratio * (topologyBounds.bottom - topologyBounds.top);
            const deploymentMap = new Map(props.deployments.map((item) => [item.node, item]));
            const focusNodes = new Set(props.deployments.map((item) => `bus-${item.node}`));

            graph.value = new G6.Graph({
              container: graphContainer,
              width,
              height,
              renderer: "canvas",
              fitView: false,
              modes: { default: ["drag-node", "drag-canvas", "zoom-canvas"] },
              defaultNode: {
                type: "circle",
                size: 24,
                style: { fill: "rgba(15, 23, 42, 0.92)", stroke: "rgba(96, 165, 250, 0.7)", lineWidth: 1.6 },
                labelCfg: { style: { fill: "#cbd5e1", fontSize: 10, fontWeight: 700 } },
              },
              defaultEdge: {
                type: "line",
                style: { stroke: "rgba(71, 85, 105, 0.62)", lineWidth: 1.4 },
                labelCfg: {
                  autoRotate: true,
                  style: { fill: "#cbd5e1", fontSize: 11, background: { fill: "rgba(15, 23, 42, 0.72)", padding: [2, 4, 2, 4], radius: 2 } },
                },
              },
            });

            const nodes = Array.from({ length: 39 }, (_, index) => {
              const nodeNo = index + 1;
              const [xRatio, yRatio] = scatterPositions[index];
              const deployment = deploymentMap.get(nodeNo);
              return {
                id: `bus-${nodeNo}`,
                label: String(nodeNo),
                x: scatterX(xRatio),
                y: scatterY(yRatio),
                size: deployment ? 34 : 22,
                style: deployment
                  ? { fill: deployment.color, stroke: "#f8fafc", lineWidth: 3, shadowColor: deployment.color, shadowBlur: 14 }
                  : undefined,
                labelCfg: {
                  style: {
                    fill: deployment ? "#020617" : "#cbd5e1",
                    fontSize: deployment ? 12 : 10,
                    fontWeight: 800,
                  },
                },
              };
            });
            nodes.push({
              id: "ieee39",
              label: "pandapower\nIEEE 39",
              x: centerX,
              y: height * 0.69,
              type: "rect",
              size: [118, 46],
              style: { fill: "rgba(30, 41, 59, 0.94)", stroke: "#93c5fd", lineWidth: 2 },
              labelCfg: { style: { fill: "#dbeafe", fontSize: 13, fontWeight: 800 } },
            });

            const ringEdges = Array.from({ length: 39 }, (_, index) => ({
              source: `bus-${index + 1}`,
              target: `bus-${index === 38 ? 1 : index + 2}`,
              style: {
                stroke: focusNodes.has(`bus-${index + 1}`) || focusNodes.has(`bus-${index === 38 ? 1 : index + 2}`)
                  ? "rgba(96, 165, 250, 0.9)"
                  : "rgba(71, 85, 105, 0.54)",
                lineWidth: focusNodes.has(`bus-${index + 1}`) || focusNodes.has(`bus-${index === 38 ? 1 : index + 2}`) ? 2.4 : 1.2,
              },
            }));
            const tieEdges = [
              [1, 21], [2, 22], [3, 23], [4, 24], [5, 25], [6, 26], [7, 27], [8, 28], [9, 29],
              [10, 30], [11, 31], [12, 32], [13, 33], [14, 34], [15, 35], [16, 36], [17, 37], [18, 38], [19, 39],
              [3, 12], [12, 25], [25, 3],
            ].map(([source, target]) => ({
              source: `bus-${source}`,
              target: `bus-${target}`,
              style: {
                stroke: focusNodes.has(`bus-${source}`) && focusNodes.has(`bus-${target}`) ? "rgba(251, 191, 36, 0.82)" : "rgba(71, 85, 105, 0.48)",
                lineWidth: focusNodes.has(`bus-${source}`) && focusNodes.has(`bus-${target}`) ? 2.6 : 1.1,
                lineDash: focusNodes.has(`bus-${source}`) && focusNodes.has(`bus-${target}`) ? [5, 4] : undefined,
              },
            }));
            const edges = [...ringEdges, ...tieEdges];

            props.deployments.forEach((item, index) => {
              const baseNode = nodes.find((node) => node.id === `bus-${item.node}`);
              const vppSlots = [
                { x: width * 0.22, y: height * 0.76 },
                { x: width * 0.50, y: height * 0.78 },
                { x: width * 0.74, y: height * 0.76 },
              ];
              const vppSlot = vppSlots[index] || { x: baseNode.x, y: baseNode.y + 92 };
              const vppX = vppSlot.x;
              const vppY = Math.min(height - 84, vppSlot.y);
              nodes.push({
                id: item.id,
                label: `${item.id}\n${item.owner}`,
                x: vppX,
                y: vppY,
                type: "rect",
                size: [116, 44],
                style: { fill: "rgba(15, 23, 42, 0.96)", stroke: item.color, lineWidth: 2.4, radius: 5 },
                labelCfg: { style: { fill: "#f8fafc", fontSize: 12, fontWeight: 800 } },
              });
              item.units.forEach((unit, unitIndex) => {
                const unitX = vppX + (unitIndex - (item.units.length - 1) / 2) * 58;
                const unitY = vppY + 66;
                nodes.push({
                  id: `${item.id}-${unit.key}`,
                  label: unit.label,
                  x: unitX,
                  y: unitY,
                  size: [50, 26],
                  type: "rect",
                  style: { fill: unit.color, stroke: "rgba(248, 250, 252, 0.72)", lineWidth: 1.4, radius: 4 },
                  labelCfg: { style: { fill: "#020617", fontSize: 11, fontWeight: 800 } },
                });
                edges.push({
                  source: item.id,
                  target: `${item.id}-${unit.key}`,
                  label: "自治资源",
                  style: { stroke: item.color, lineWidth: 1.6, lineDash: [4, 4] },
                });
              });
              edges.push({
                source: `bus-${item.node}`,
                target: item.id,
                label: `node ${item.node}`,
                style: { stroke: item.color, lineWidth: 3 },
              });
            });

            graph.value.data({ nodes, edges });
            graph.value.render();
          };

          watch(() => props.deployments, () => nextTick(renderGraph), { deep: true });
          onMounted(() => {
            nextTick(renderGraph);
            const requestResize = () => {
              window.clearTimeout(resizeTimer);
              resizeTimer = window.setTimeout(renderGraph, 120);
            };
            resizeObserver = new ResizeObserver(requestResize);
            resizeObserver.observe(container.value);
          });
          onBeforeUnmount(() => {
            if (resizeObserver) resizeObserver.disconnect();
            window.clearTimeout(resizeTimer);
            if (graph.value) graph.value.destroy();
          });
          return { container };
        },
      };

      createApp({
        components: { TopologyGraph },
        setup() {
          const selectedDate = ref(MarketUI.selectedDate());
          const dates = MarketUI.dates();
          const availableDates = new Set(dates);
          const charts = {};
          let chartResizeHandler = null;
          const vppDeployments = [
            {
              id: "VPP1",
              node: 3,
              owner: "主体A",
              resources: "风电 + 储能",
              color: "#14b8a6",
              units: [
                { key: "wind", label: "风电", color: "#14b8a6" },
                { key: "storage", label: "储能", color: "#fbbf24" },
              ],
            },
            {
              id: "VPP2",
              node: 12,
              owner: "主体B",
              resources: "光伏 + 储能",
              color: "#fbbf24",
              units: [
                { key: "solar", label: "光伏", color: "#fbbf24" },
                { key: "storage", label: "储能", color: "#60a5fa" },
              ],
            },
            {
              id: "VPP3",
              node: 25,
              owner: "主体C",
              resources: "火电 + 光伏 + 储能",
              color: "#3b82f6",
              units: [
                { key: "thermal", label: "火电", color: "#60a5fa" },
                { key: "solar", label: "光伏", color: "#fbbf24" },
                { key: "storage", label: "储能", color: "#14b8a6" },
              ],
            },
          ];

          const selectedYear = computed(() => Number(selectedDate.value.slice(0, 4)));
          const current = computed(() => MarketUI.yearData(selectedYear.value));
          const vppPhysicalParamCatalog = {
            VPP1: [
              { parameter: "装机(MW)", value: "100-200 MW" },
              { parameter: "储能容量(MWh)", value: "10-20 MWh" },
              { parameter: "最大充放功率(MW)", value: "10-15 MW" },
            ],
            VPP2: [
              { parameter: "装机(MW)", value: "50-100 MW" },
              { parameter: "储能容量(MWh)", value: "10-15 MWh" },
              { parameter: "最大充放功率(MW)", value: "10-15 MW" },
            ],
            VPP3: [
              { parameter: "光伏装机(MW)", value: "50-100 MW" },
              { parameter: "火电装机(MW)", value: "50-70 MW" },
              { parameter: "储能容量(MWh)", value: "10-15 MWh" },
              { parameter: "最大充放功率(MW)", value: "15-20 MW" },
            ],
          };
          const vppIntegratedRows = computed(() =>
            vppDeployments.map((deployment) => {
              const params = vppPhysicalParamCatalog[deployment.id] || [];
              const installedCapacity = params
                .filter((item) => item.parameter.includes("装机"))
                .map((item) =>
                  item.parameter === "装机(MW)"
                    ? item.value
                    : `${item.parameter.replace("(MW)", "")}${item.value}`,
                )
                .join(" / ");
              const storageCapacity =
                params.find((item) => item.parameter.includes("储能容量"))?.value || "--";
              const maxChargeDischarge =
                params.find((item) => item.parameter.includes("最大充放功率"))?.value || "--";

              return {
                id: deployment.id,
                node: `node ${deployment.node}`,
                resources: deployment.resources,
                owner: deployment.owner,
                installedCapacity: installedCapacity || "--",
                storageCapacity,
                maxChargeDischarge,
                remarks:
                  deployment.units.length > 2
                    ? "多资源协同调节"
                    : "新能源+储能联合运行",
              };
            }),
          );

          const initChart = (id) => {
            charts[id] = echarts.init(document.getElementById(id), "dark");
          };

          const formatLocalDate = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
          };

          const disableUnavailableDate = (date) =>
            !availableDates.has(formatLocalDate(date));

          const updateCharts = () => {
            const yd = current.value;
            const daySeries = MarketUI.dailySeries(selectedDate.value);
            const months = yd.monthly.map((item) => item.month);

            charts.loadRenewableChart.setOption({
              backgroundColor: "transparent",
              title: { text: "15分钟出力与电价", left: "center", top: 0, textStyle: { color: "#dbeafe", fontSize: 15 } },
              tooltip: { trigger: "axis" },
              legend: { bottom: 0, textStyle: { color: MarketUI.chartText }, data: ["光伏", "风电", "电价"] },
              grid: { top: 50, left: 56, right: 54, bottom: 50 },
              xAxis: { type: "category", data: daySeries.map((item) => item.time), axisLabel: { color: MarketUI.chartText, interval: 7 }, axisLine: MarketUI.axisLine },
              yAxis: [
                { type: "value", name: "MW", nameTextStyle: { color: MarketUI.chartText, fontWeight: 700 }, axisLabel: { color: MarketUI.chartText }, splitLine: MarketUI.dashedGrid },
                { type: "value", name: "元/MWh", nameTextStyle: { color: MarketUI.chartText, fontWeight: 700 }, axisLabel: { color: MarketUI.chartText }, splitLine: { show: false } },
              ],
              series: [
                { name: "光伏", type: "line", smooth: true, data: daySeries.map((item) => item.solar), itemStyle: { color: MarketUI.colors.yellow }, lineStyle: { width: 3 } },
                { name: "风电", type: "line", smooth: true, data: daySeries.map((item) => item.wind), itemStyle: { color: MarketUI.colors.teal }, lineStyle: { width: 3 } },
                { name: "电价", type: "line", yAxisIndex: 1, smooth: true, data: daySeries.map((item) => item.price), itemStyle: { color: MarketUI.colors.pink }, lineStyle: { width: 3 } },
              ],
            }, true);

            charts.busRangeChart.setOption({
              backgroundColor: "transparent",
              title: { text: "月度新能源出力与均价", left: "center", top: 0, textStyle: { color: "#dbeafe", fontSize: 15 } },
              tooltip: { trigger: "axis" },
              legend: { bottom: 0, textStyle: { color: MarketUI.chartText }, data: ["光伏", "风电", "均价"] },
              grid: { top: 50, left: 58, right: 54, bottom: 52 },
              xAxis: { type: "category", data: months, axisLabel: { color: MarketUI.chartText }, axisLine: MarketUI.axisLine },
              yAxis: [
                { type: "value", name: "MW", nameTextStyle: { color: MarketUI.chartText, fontWeight: 700 }, axisLabel: { color: MarketUI.chartText }, splitLine: MarketUI.dashedGrid },
                { type: "value", name: "元/MWh", nameTextStyle: { color: MarketUI.chartText, fontWeight: 700 }, axisLabel: { color: MarketUI.chartText }, splitLine: { show: false } },
              ],
              series: [
                { name: "光伏", type: "bar", data: yd.monthly.map((item) => item.avgSolar), itemStyle: { color: MarketUI.colors.yellow }, barMaxWidth: 22 },
                { name: "风电", type: "bar", data: yd.monthly.map((item) => item.avgWind), itemStyle: { color: MarketUI.colors.teal }, barMaxWidth: 22 },
                { name: "均价", type: "line", yAxisIndex: 1, smooth: true, data: yd.monthly.map((item) => item.avgPrice), itemStyle: { color: MarketUI.colors.pink }, lineStyle: { width: 3 } },
              ],
            }, true);

          };

          watch(selectedDate, (date) => {
            localStorage.setItem("marketSelectedDate", date);
            localStorage.setItem("marketSelectedYear", String(Number(date.slice(0, 4))));
            nextTick(updateCharts);
          });

          onMounted(() => {
            nextTick(() => {
              ["loadRenewableChart", "busRangeChart"].forEach(initChart);
              updateCharts();
              chartResizeHandler = () => Object.values(charts).forEach((chart) => chart.resize());
              window.addEventListener("resize", chartResizeHandler);
            });
          });

          onBeforeUnmount(() => {
            window.removeEventListener("resize", chartResizeHandler);
            Object.values(charts).forEach((chart) => chart.dispose());
          });

          return {
            dates,
            selectedDate,
            disableUnavailableDate,
            vppDeployments,
            vppIntegratedRows,
          };
        },
      })
        .use(ElementPlus)
        .mount("#app");
      window.SystemAccess.mountUserPanel("sessionPanel");

      if (window.ChartExport && window.ChartExportBuilders) {
        window.ChartExport.register({
          key: "marketDaily",
          filename: "负荷新能源出力与电价_全部日期",
          build: () => window.ChartExportBuilders.marketDailyFull(marketData),
        });
        window.ChartExport.register({
          key: "marketMonthly",
          filename: "月度新能源出力与均价_全部年份",
          build: () => window.ChartExportBuilders.marketMonthlyFull(marketData),
        });
        window.ChartExport.mount();
      }
      })().catch((error) => {
        console.error("Failed to initialize data-management.html", error);
      });
    </script>
  </body>
</html>
